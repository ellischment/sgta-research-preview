name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install ruff vulture
      - run: ruff check sgta tests scripts
      - run: ruff format --check sgta tests scripts
      - run: vulture sgta --min-confidence 80
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[gpu,dev]"
      - run: python -m pytest -q
  protocol:
    # HYPOTHESES.md is pre-registered: its hash must match the one that was sent out
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sha256sum -c HYPOTHESES.sha256
