<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" role="img" aria-labelledby="t d"><title id="t">SGTA pipeline</title><desc id="d">Four stages: extract answers, samples and hidden states; fit spherical cells on train data only; perturb the state by rotation and see whether the decision flips; apply the frozen protocol to give a verdict per hypothesis.</desc><rect width="880" height="350" rx="14" fill="#11140D"/><text x="40" y="44" text-anchor="start" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22"  fill="#A3A890" letter-spacing="1">protocol frozen before data · hash checked in CI</text><line x1="40" y1="60" x2="840" y2="60" stroke="#A3A890" stroke-width="2"/><line x1="40" y1="60" x2="40" y2="72" stroke="#A3A890" stroke-width="2"/><line x1="840" y1="60" x2="840" y2="72" stroke="#A3A890" stroke-width="2"/><rect x="40.0" y="92" width="170" height="170" rx="12" fill="none" stroke="#4A5139" stroke-width="2"/><text x="125.0" y="128" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#ECE9D8" >1 extract</text><line x1="73.0" y1="156" x2="177.0" y2="156" stroke="#4A5139" stroke-width="2"/><circle cx="145.0" cy="156" r="5.5" fill="#86AEDC"/><line x1="73.0" y1="172" x2="177.0" y2="172" stroke="#4A5139" stroke-width="2"/><circle cx="142.0" cy="172" r="5.5" fill="#86AEDC"/><line x1="73.0" y1="188" x2="177.0" y2="188" stroke="#4A5139" stroke-width="2"/><circle cx="139.0" cy="188" r="5.5" fill="#86AEDC"/><line x1="73.0" y1="204" x2="177.0" y2="204" stroke="#4A5139" stroke-width="2"/><circle cx="136.0" cy="204" r="5.5" fill="#86AEDC"/><line x1="73.0" y1="220" x2="177.0" y2="220" stroke="#4A5139" stroke-width="2"/><circle cx="133.0" cy="220" r="5.5" fill="#86AEDC"/><line x1="73.0" y1="236" x2="177.0" y2="236" stroke="#4A5139" stroke-width="2"/><circle cx="130.0" cy="236" r="5.5" fill="#86AEDC"/><text x="125.0" y="296" text-anchor="middle" font-family="system-ui, -apple-syste